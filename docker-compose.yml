# Local development stack: Spring Boot control center + PostgreSQL.
# Usage:  cp .env.example .env  &&  docker compose up --build
name: control-center

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-controlcenter}
      POSTGRES_USER: ${DB_USERNAME:-controlcenter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
    image: cloud-deployment-control-center:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-controlcenter}
      DB_USERNAME: ${DB_USERNAME:-controlcenter}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      DB_SSL_MODE: disable
      APP_ENVIRONMENT: local
      APP_VERSION: local
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      HEALTH_CHECK_ENABLED: ${HEALTH_CHECK_ENABLED:-true}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-PT60S}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-PT3S}
      GITHUB_DISPATCH_ENABLED: ${GITHUB_DISPATCH_ENABLED:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    # Same hardening as the ECS task: read-only root filesystem with a writable /tmp,
    # no Linux capabilities (the app binds an unprivileged port as UID 10001).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Mirror the Fargate task: 1 GiB memory, from which the JVM sizes its heap
    # (MaxRAMPercentage=75), and ECS's 30 s stop timeout. Docker's default of 10 s would
    # kill the app during its 20 s graceful shutdown.
    mem_limit: 1g
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
