<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Register application')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('applications')}"></header>
<main class="container">
  <div class="breadcrumb"><a th:href="@{/applications}">Applications</a> / New</div>
  <h1>Register application</h1>
  <p class="muted">An application maps to one GitHub repository that builds one container image.</p>

  <div class="card">
    <form class="stacked" th:action="@{/applications}" th:object="${applicationForm}" method="post">
      <label for="name">Name</label>
      <input type="text" id="name" th:field="*{name}" placeholder="payments-api" required>
      <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

      <label for="repositoryUrl">GitHub repository URL</label>
      <input type="url" id="repositoryUrl" th:field="*{repositoryUrl}" placeholder="https://github.com/acme/payments-api" required>
      <div class="field-error" th:if="${#fields.hasErrors('repositoryUrl')}" th:errors="*{repositoryUrl}"></div>

      <label for="defaultBranch">Default branch</label>
      <input type="text" id="defaultBranch" th:field="*{defaultBranch}">
      <div class="field-error" th:if="${#fields.hasErrors('defaultBranch')}" th:errors="*{defaultBranch}"></div>

      <label for="description">Description</label>
      <textarea id="description" th:field="*{description}" placeholder="What does this service do?"></textarea>
      <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>

      <div class="form-actions">
        <button type="submit" class="btn">Register</button>
        <a class="btn btn-secondary" th:href="@{/applications}">Cancel</a>
      </div>
    </form>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
