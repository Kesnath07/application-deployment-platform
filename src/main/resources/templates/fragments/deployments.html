<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!-- Reusable deployment history table. showTarget=true adds application/environment columns;
     rollbackIds (nullable) lists deployments that can be restored with a rollback action. -->
<div th:fragment="table(deployments, showTarget, rollbackIds)" class="table-wrap">
  <p th:if="${#lists.isEmpty(deployments)}" class="muted">No deployments yet.</p>
  <table th:unless="${#lists.isEmpty(deployments)}">
    <thead>
    <tr>
      <th>#</th>
      <th th:if="${showTarget}">Application</th>
      <th th:if="${showTarget}">Environment</th>
      <th>Version</th>
      <th>Image tag</th>
      <th>Status</th>
      <th>Created</th>
      <th>Duration</th>
      <th th:if="${rollbackIds != null}"></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${deployments}">
      <td><a th:href="@{/deployments/{id}(id=${d.id})}" th:text="${d.id}">1</a></td>
      <td th:if="${showTarget}">
        <a th:href="@{/applications/{id}(id=${d.application.id})}" th:text="${d.application.name}">app</a>
      </td>
      <td th:if="${showTarget}">
        <a th:href="@{/environments/{id}(id=${d.environment.id})}" th:text="${d.environment.name}">env</a>
      </td>
      <td class="mono">
        <span th:text="${d.version}">v1</span>
        <span th:if="${d.rollback}" class="badge badge-ROLLED_BACK" title="Rollback deployment">rollback</span>
      </td>
      <td class="mono" th:text="${@fmt.shortTag(d.imageTag)}" th:title="${d.imageTag}">sha</td>
      <td><span class="badge" th:classappend="'badge-' + ${d.status}" th:text="${d.status}">SUCCESS</span></td>
      <td th:text="${@fmt.time(d.createdAt)}">time</td>
      <td th:text="${@fmt.duration(d.startedAt, d.completedAt)}">1m</td>
      <td th:if="${rollbackIds != null}">
        <form th:if="${rollbackIds.contains(d.id)}" class="inline-form" method="post"
              th:action="@{/environments/{id}/rollback(id=${d.environment.id})}"
              th:attr="onsubmit=|return confirm('Roll back to ${d.version}?')|">
          <input type="hidden" name="targetDeploymentId" th:value="${d.id}">
          <button type="submit" class="btn btn-sm btn-warning">Roll back to this</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
