# All environment-specific values are injected through environment variables.
# Locally they come from docker-compose / .env, in AWS from the ECS task definition
# (plain values) and AWS Secrets Manager (database credentials).
spring:
  application:
    name: cloud-deployment-control-center
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:controlcenter}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USERNAME:controlcenter}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  # The ALB terminates client connections and forwards X-Forwarded-* headers.
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

control-center:
  version: ${APP_VERSION:local}
  environment: ${APP_ENVIRONMENT:local}
  health-check:
    enabled: ${HEALTH_CHECK_ENABLED:true}
    interval: ${HEALTH_CHECK_INTERVAL:PT60S}
    timeout: ${HEALTH_CHECK_TIMEOUT:PT3S}
    path: /api/health
  github:
    enabled: ${GITHUB_DISPATCH_ENABLED:false}
    token: ${GITHUB_TOKEN:}
    workflow-file: ${GITHUB_WORKFLOW_FILE:deploy.yml}

logging:
  level:
    root: INFO
    com.controlcenter: ${APP_LOG_LEVEL:INFO}
