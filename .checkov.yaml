# Checkov configuration for the Terraform code.
# Every skipped check is an explicit, documented trade-off for this MVP
# (see docs/security.md). Any new finding fails the pipeline.
compact: true
skip-check:
  # Encryption with AWS-managed keys instead of customer-managed KMS keys (cost/complexity).
  - CKV_AWS_158 # CloudWatch log group encrypted with KMS CMK
  - CKV_AWS_149 # Secrets Manager secret encrypted with KMS CMK (aws/secretsmanager key is used)
  - CKV_AWS_136 # ECR repository encrypted with KMS CMK (AES256 is used)
  # Optional services intentionally out of scope.
  - CKV_AWS_91  # ALB access logs require an S3 bucket
  - CKV_AWS_118 # RDS enhanced monitoring (standard CloudWatch RDS metrics + alarms are used)
  - CKV_AWS_353 # RDS Performance Insights (not available on the smallest instance classes)
  - CKV_AWS_161 # RDS IAM authentication (password stored in Secrets Manager is used)
  - CKV_AWS_394 # Pinning AZ IDs on the availability-zones data source
  # Configured per environment through variables: dev favours cost, prod enables them.
  - CKV_AWS_2   # HTTPS listener (enabled when certificate_arn is set)
  - CKV_AWS_103 # TLS 1.2+ on listeners (HTTPS listener uses ELBSecurityPolicy-TLS13-1-2-2021-06)
  - CKV_AWS_260 # Port 80 open: redirects to HTTPS when a certificate is configured; restrict with alb_ingress_cidrs
  - CKV_AWS_150 # ALB deletion protection (enabled in prod)
  - CKV_AWS_157 # RDS Multi-AZ (enabled in prod)
  - CKV_AWS_293 # RDS deletion protection (enabled in prod)
  - CKV_AWS_65  # ECS Container Insights (enabled in prod)
